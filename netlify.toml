[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

[[redirects]]
  from = "http://geliconstructionservices.com.au/*"
  to = "https://geliconstructionservices.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.geliconstructionservices.com.au/*"
  to = "https://geliconstructionservices.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.geliconstructionservices.com.au/*"
  to = "https://geliconstructionservices.com.au/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
